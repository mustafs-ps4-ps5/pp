<html manifest="Cache.manifest">
<head>
<meta charset="utf-8">
<title>Mustafa PS4 Host - Installing Cache</title>
<link rel="stylesheet" href="../style.css">
<style>
html, body { overflow: hidden; }
</style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="main-title">
                <span class="highlight">Mustafa</span>
                <span class="ps4-text"> PS4</span>
                <span class="ps5-text"> Host</span>
            </h1>
            <div class="subtitle" id="cacheTitle">Installing Cache</div>
            <div class="version-badge">FW 5.05 · 7.XX - 13.52</div>
        </header>
        <hr class="separator">
        <div class="status-bar">
            <span id="progress" class="status-text">Installing Cache...</span>
        </div>
    </div>

<script>
var cacheTranslations = {
    ar: {
        title: 'جاري تثبيت الكاش',
        installing: 'جاري تثبيت الكاش: ',
        percent: '%',
        success: 'تم تثبيت الكاش بنجاح',
        reopen: 'أعد فتح الصفحة...'
    },
    en: {
        title: 'Installing Cache',
        installing: 'Installing Cache: ',
        percent: '%',
        success: 'Cache Installed Successfully',
        reopen: 'Reopen the Page...'
    }
};

var cacheLang = 'ar';
try {
    var savedLang = localStorage.getItem('preferredLang');
    if (savedLang && cacheTranslations[savedLang]) cacheLang = savedLang;
} catch(e) {}

var ct = cacheTranslations[cacheLang];
document.getElementById('cacheTitle').textContent = ct.title;
document.documentElement.dir = cacheLang === 'ar' ? 'rtl' : 'ltr';
document.documentElement.lang = cacheLang;

/* ===== المنطق الأصلي (لم يتغير) ===== */
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);

function DLProgress(e){
    var Percent=(Math.round(e.loaded / e.total * 100));
    setTimeout(function(){window.progress.innerHTML = ct.installing + Percent + ct.percent;},500);
}
function DisplayCacheProgress(){
    setTimeout(function(){window.progress.innerHTML = ct.success;},1500);
    setTimeout(function(){window.progress.innerHTML = ct.reopen;},3500);
}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
</script>
</body>
</html>
